name: Detect Secrets

# The pre-commit hook is the first line of defence, but `git commit --no-verify` walks past it, so the
# same scan runs here. This repository is public: anything that reaches a branch is readable
# immediately, and deleting the branch or rewriting history does not unpublish it.
# The sibling repositories trigger on an unfiltered `push`. That does not work here, for two reasons
# that both come from this repository being public. A pull request from a fork never fires the base
# repository's `push` event, so `push` alone leaves exactly the case an outside contributor can reach
# unscanned. And adding `pull_request` next to an unfiltered `push` makes both fire for an in-repository
# pull request, which produces *two* check runs called "Detect secrets" against the same commit — one of
# them skipped. Which of the two a required status check would then observe is unspecified, so a gate
# built on it could be satisfied by the skipped one without the scan ever running.
#
# Restricting `push` to `main` gives every commit exactly one scan: pull requests (including forks) are
# covered by `pull_request` against the merge result, and `main` by `push` after the merge. The gap is a
# branch pushed without a pull request; it is scanned as soon as one is opened, and GitHub's own push
# protection covers credentials in real time.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull request runs are cancellable, and `push` above only fires for `main`, so this says
  # "never cancel a scan of main". The scan reads the checked-out tree rather than history, so a
  # cancelled run means that commit was never scanned at all. Superseding a pull request run is safe:
  # the replacement scans the newer head.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-secrets:
    name: Detect secrets
    # No `if:` here on purpose. A condition that skips the job still publishes a check run under this
    # name, so it would reintroduce the ambiguity the trigger list above is written to avoid.
    #
    # ubuntu-latest, not the organisation's ubuntu-slim label: this repository has no self-hosted
    # runners and receives no organisation secrets or variables, so it is outside the shared runner
    # scoping, and a label that does not resolve leaves the job queued forever rather than failing.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to an immutable commit SHA for the reason given in ci.yml — this workflow also runs
      # for pull requests from forks.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Slack notification step, unlike the sibling repositories: their workflows read
      # `secrets.GHA_NOTIFIER_SLACK_BOT_TOKEN` and `vars.GHA_SLACK_CHANNEL`, and no organisation
      # secret or variable is shared with this repository (measured: 0 of each, against 16 for
      # fc-datastore). A step referencing them would run with empty values instead of notifying.
      # The check status is the signal.
      - name: Run detect-secrets
        uses: sensyn-robotics/github-action-detect-secrets@5e6088f13e30401c95540f0a0365a5b79c5ac1b2 # v1.0.0
        with:
          baseline: '.secrets.baseline.json'
          detect-secrets-version: '1.5.0'
