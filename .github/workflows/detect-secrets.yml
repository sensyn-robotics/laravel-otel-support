name: Detect Secrets

# The pre-commit hook is the first line of defence, but `git commit --no-verify` walks past it, so the
# same scan runs here. This repository is public: anything that reaches a branch is readable
# immediately, and deleting the branch or rewriting history does not unpublish it.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run for `main`: the scan looks at the checked-out tree, not at history, so a
  # cancelled run means that commit was never scanned. Superseding a pull request run is fine —
  # the replacement scans the newer head.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  detect-secrets:
    name: Detect secrets
    # `push` covers every branch of this repository, so a pull request from inside it would scan the
    # same tree twice. A pull request from a fork is the case `push` cannot see, so that is the only
    # one this trigger has to handle.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    # ubuntu-latest, not the organisation's ubuntu-slim label: this repository has no self-hosted
    # runners and receives no organisation secrets or variables, so it is outside the shared runner
    # scoping, and a label that does not resolve leaves the job queued forever rather than failing.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to an immutable commit SHA for the reason given in ci.yml — this workflow also runs
      # for pull requests from forks.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Slack notification step, unlike the sibling repositories: their workflows read
      # `secrets.GHA_NOTIFIER_SLACK_BOT_TOKEN` and `vars.GHA_SLACK_CHANNEL`, and no organisation
      # secret or variable is shared with this repository (measured: 0 of each, against 16 for
      # fc-datastore). A step referencing them would run with empty values instead of notifying.
      # The check status is the signal.
      - name: Run detect-secrets
        uses: sensyn-robotics/github-action-detect-secrets@5e6088f13e30401c95540f0a0365a5b79c5ac1b2 # v1.0.0
        with:
          baseline: '.secrets.baseline.json'
          detect-secrets-version: '1.5.0'
